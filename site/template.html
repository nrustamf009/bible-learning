<title>Mark in the Margins</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Ruslan+Display&family=Unbounded:wght@500;700;900&family=Golos+Text:wght@400;500;600;700&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Neucha&family=PT+Sans+Narrow:wght@700&display=swap">
<style>
/* Layout: a book with margins. The comic runs as one vertical strip (webtoon) in the
   text block; each panel has its gloss in the outer margin (below it on phones), the way
   a glossed Gospel puts the Fathers around the text. Back matter follows the strip. */
:root {
  --paper: #F1F1EC; --paper-2: #E6E6DF; --ink: #17171B; --ink-2: #5A5A62; --rule: #CCCCC3;
  --lapis: #2A3CC0; --lapis-ink: #FFFFFF; --lapis-soft: #E2E5F8; --sun: #FFD84D; --gold: #9A6E12; --warn: #9C4A12; --plate: #0D0E11;
  --display: "Yeseva One", "Georgia", "Times New Roman", serif;
  --text: "Golos Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --book: "Old Standard TT", "Georgia", "Times New Roman", serif;
  --letter: "PT Sans Narrow", "Arial Narrow", Arial, sans-serif;
  --hand: "Neucha", "Comic Sans MS", "Segoe Print", cursive;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #121316; --paper-2: #1B1C21; --ink: #E9E8E3; --ink-2: #A3A3AB; --rule: #2E2F36;
  --lapis: #9DAAFF; --lapis-ink: #0B0D24; --lapis-soft: #1D2142; --gold: #E2BC62; --warn: #F0A56A; --plate: #000000; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #121316; --paper-2: #1B1C21; --ink: #E9E8E3; --ink-2: #A3A3AB; --rule: #2E2F36;
  --lapis: #9DAAFF; --lapis-ink: #0B0D24; --lapis-soft: #1D2142; --gold: #E2BC62; --warn: #F0A56A; --plate: #000000; color-scheme: dark }

* { box-sizing: border-box }
html, body { background: var(--paper) }
body { margin: 0; color: var(--ink); font: 400 17px/1.6 var(--text) }
[data-skin="kids"] body { font-size: 19px }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper) }
a { color: var(--lapis); text-underline-offset: 3px }
h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.08; margin: 0; text-wrap: balance }
button { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--lapis); outline-offset: 3px }
.page { width: 100%; max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.measure { max-width: 680px }
.small { font-size: 14px; color: var(--ink-2) }
.book { font-family: var(--book) }
.eyebrow { font: italic 400 17px/1.3 var(--book); color: var(--ink-2) }

/* ------------------------------------------------ top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 1px solid var(--rule) }
.bar-in { display: flex; align-items: baseline; gap: 8px 22px; padding-block: 12px; flex-wrap: wrap }
.mark { font: 400 23px/1 var(--display); color: var(--ink); text-decoration: none; margin-right: auto; white-space: nowrap }
.mark i { font: italic 400 15px var(--book); color: var(--ink-2); margin-left: 6px }
.nav { display: flex; gap: 18px; flex-wrap: wrap }
.nav a { color: var(--ink-2); text-decoration: none; font-size: 15px; padding-block: 4px; border-bottom: 2px solid transparent }
.nav a[aria-current="page"] { color: var(--ink); border-color: var(--lapis) }
.reader-btn { border: 0; background: none; padding: 4px 0; font-size: 15px; color: var(--lapis); cursor: pointer; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 4px }
@media (max-width: 720px) { .mark i { display: none } .nav { order: 3; width: 100%; gap: 14px; flex-wrap: nowrap; overflow-x: auto } .nav a { font-size: 14px; white-space: nowrap } }

/* ------------------------------------------------ buttons */
.btn { display: inline-flex; align-items: center; gap: 10px; border: 1.5px solid var(--ink); background: var(--ink); color: var(--paper); padding: 12px 20px; font: 600 15px/1 var(--text); text-decoration: none; cursor: pointer; border-radius: 2px }
.btn.line { background: transparent; color: var(--ink) }
[data-skin="kids"] .btn { border-radius: 12px; border-width: 2.5px; box-shadow: 3px 3px 0 var(--ink); font-size: 17px }
[data-skin="kids"] .btn:not(.line) { background: var(--lapis); color: var(--lapis-ink); border-color: var(--ink) }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center }

/* ------------------------------------------------ setup */
.veil { position: fixed; inset: 0; z-index: 40; background: rgba(10, 10, 14, .55); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
.dialog { width: min(560px, 100%); max-height: 100%; overflow: auto; background: var(--paper); color: var(--ink); border: 1.5px solid var(--ink); padding: 28px; display: grid; gap: 22px }
.dialog h2 { font-size: 34px }
.choice { display: grid; gap: 6px }
.choice > span { font: italic 400 16px var(--book); color: var(--ink-2) }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px }
.opt { text-align: left; border: 1.5px solid var(--rule); background: transparent; padding: 12px 14px; cursor: pointer; display: grid; gap: 2px }
.opt b { font-weight: 600 }
.opt small { color: var(--ink-2); font-size: 13px; line-height: 1.35 }
.opt[aria-pressed="true"] { border-color: var(--lapis); background: var(--lapis-soft) }

/* ------------------------------------------------ title page */
.title-page { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 48px; align-items: center; padding-block: 56px 40px }
@media (max-width: 880px) { .title-page { grid-template-columns: minmax(0, 1fr); gap: 28px; padding-top: 32px } }
.title-page h1 { font-size: clamp(48px, 7vw, 86px); margin-block: 10px 18px }
.title-page p.lede { font-size: 19px; margin: 0 0 24px; max-width: 30em }
.plate { margin: 0 }
.plate img { width: 100%; max-width: 100%; aspect-ratio: 2 / 1; object-fit: cover; display: block; border: 1px solid var(--ink) }
[data-skin="kids"] .plate img { border: 3px solid var(--ink); border-radius: 14px }
.plate figcaption { font: italic 400 15px/1.4 var(--book); color: var(--ink-2); margin-top: 8px }
.how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; padding-block: 28px 44px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule) }
@media (max-width: 760px) { .how { grid-template-columns: minmax(0, 1fr); gap: 16px } }
.how b { display: block; font: 400 22px/1.2 var(--display); margin-bottom: 6px }
.how p { margin: 0; font-size: 15px; color: var(--ink-2) }

.contents { padding-block: 40px 20px; display: grid; gap: 36px }
.contents > h2 { font-size: clamp(36px, 5vw, 52px) }
.season h3 { font-size: 28px; display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; padding-bottom: 10px; border-bottom: 1.5px solid var(--ink) }
.season h3 .book { font-size: 16px; font-style: italic; color: var(--ink-2) }
.toc { list-style: none; margin: 0; padding: 0 }
.toc li { border-bottom: 1px solid var(--rule) }
.toc a, .toc .soon { display: grid; grid-template-columns: 112px 2.6em minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 12px 0; color: inherit; text-decoration: none }
.toc a:hover .t { color: var(--lapis) }
.toc .thumb { width: 112px; aspect-ratio: 3 / 2; object-fit: cover; display: block; border: 1px solid var(--ink); background: var(--paper-2) }
[data-skin="kids"] .toc .thumb { border-radius: 8px; border-width: 2px }
.toc .ph { width: 112px; aspect-ratio: 3 / 2; border: 1px dashed var(--rule) }
.toc .n { font: 700 22px/1 var(--book); color: var(--ink-2); font-variant-numeric: lining-nums tabular-nums }
.toc .t { font: 400 22px/1.15 var(--display) }
.toc .i { display: block; font-size: 14px; color: var(--ink-2); margin-top: 3px }
.toc .r { font: italic 400 15px var(--book); color: var(--ink-2); text-align: right; white-space: nowrap }
.toc .r em { display: block; font-style: normal; font-family: var(--text); font-size: 12px; color: var(--lapis) }
.toc .soon { opacity: .55 }
@media (max-width: 620px) { .toc a, .toc .soon { grid-template-columns: 84px minmax(0, 1fr); } .toc .thumb, .toc .ph { width: 84px } .toc .n { display: none } .toc .r { grid-column: 2; text-align: left } }

/* ------------------------------------------------ episode head */
.ep-head { display: grid; gap: 10px; padding-block: 40px 22px; max-width: 760px }
.crumbs { font-size: 14px; color: var(--ink-2) } .crumbs a { color: inherit }
.ep-head h1 { font-size: clamp(44px, 7vw, 80px) }
.ep-head .ref { font: 700 18px var(--book) } .ep-head .ref span { color: var(--lapis) }
.ep-head .q { font: italic 400 22px/1.35 var(--book); color: var(--ink-2); margin: 0 }
.hint { display: flex; gap: 10px; align-items: baseline; font-size: 15px; color: var(--ink-2); padding: 12px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin-bottom: 26px; flex-wrap: wrap }
.hint .tools { margin-left: auto; display: flex; gap: 16px }
.linkish { border: 0; background: none; padding: 0; color: var(--lapis); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: 15px }

/* ------------------------------------------------ strip + margins */
.strip { display: grid; gap: 36px; padding-bottom: 30px }
.leaf { display: grid; grid-template-columns: minmax(0, 680px) minmax(0, 1fr); gap: 36px; align-items: start }
@media (max-width: 980px) { .leaf { grid-template-columns: minmax(0, 1fr); gap: 14px } }
.panel { position: relative; aspect-ratio: 3 / 2; max-width: 100%; margin: 0; overflow: hidden; container-type: inline-size; background: var(--plate); border: 1px solid var(--ink); cursor: zoom-in }
[data-skin="kids"] .panel { border: 3px solid var(--ink); border-radius: 16px }
.panel img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block }
.panel .tails { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none }
.b { position: absolute; color: #111; background: #fff; border: 2px solid #111; padding: .42em .7em; line-height: 1.2; z-index: 2; transition: opacity .3s }
[data-skin="kids"] .b { font: 400 clamp(12px, 3.1cqw, 23px)/1.16 var(--hand); border-width: 2.5px }
[data-skin="adults"] .b { font: 700 clamp(10px, 2.3cqw, 17px)/1.18 var(--letter); letter-spacing: .02em; text-transform: uppercase }
.b.speech, .b.shout, .b.whisper { border-radius: 1.4em; text-align: center }
.b.shout { border-width: 3px }
.b.whisper { border-style: dashed; font-style: italic }
[data-skin="kids"] .b.caption { background: var(--sun); border-radius: 8px }
[data-skin="adults"] .b.caption { background: #EFE9DA; color: #18170F; border-color: #18170F; border-radius: 0; text-transform: none; font: italic 400 clamp(10px, 2.2cqw, 16px)/1.3 var(--book); letter-spacing: 0 }
.b.sfx { background: none; border: 0; padding: 0; font: 400 clamp(22px, 8cqw, 70px)/1 var(--hand); color: #FFE066; -webkit-text-stroke: 2px #2B1E2F; transform: rotate(-8deg) }
.b.hidden { opacity: 0 }
.vs { position: absolute; left: 8px; bottom: 6px; z-index: 3; font: 700 clamp(10px, 1.8cqw, 13px)/1 var(--book); color: #fff; background: rgba(0, 0, 0, .55); padding: 4px 6px }

/* the gloss in the margin */
.gloss { display: grid; gap: 12px; font-size: 15px; line-height: 1.5; padding-top: 4px }
@media (min-width: 981px) { .gloss { border-left: 1.5px solid var(--lapis); padding-left: 18px } }
@media (max-width: 980px) { .gloss { border-left: 3px solid var(--lapis); padding: 2px 0 2px 14px } }
.gloss .vref { font: 700 15px var(--book); color: var(--lapis) }
.gloss .voice { display: grid; gap: 3px }
.gloss .who { font: italic 400 14px var(--book); color: var(--ink-2) }
.gloss .say { font: 400 17px/1.5 var(--book) }
[data-skin="kids"] .gloss .say { font: 500 18px/1.45 var(--text) }
.gloss .note { font-size: 14px; color: var(--ink-2); line-height: 1.45 }
.gloss .cite { font-size: 13px; color: var(--ink-2) }
.gloss .cite b { font-weight: 600; color: var(--ink) }
.gloss .more[hidden] { display: none }
.verify-mark { color: var(--warn) }

/* glossary terms */
.term { display: inline; border: 0; background: none; padding: 0; margin: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; cursor: help;
  text-decoration: underline dotted; text-decoration-color: var(--lapis); text-decoration-thickness: 2px; text-underline-offset: .18em }
.b .term { text-decoration-color: #2A3CC0 }
.term sup { font: 700 .62em/1 var(--text); color: var(--lapis-ink); background: var(--lapis); border-radius: 50%; display: inline-grid; place-items: center; width: 1.35em; height: 1.35em; margin-left: .15em; vertical-align: .55em; text-decoration: none }
.b .term sup { color: #fff; background: #2A3CC0 }
.pop { position: absolute; z-index: 45; width: min(340px, calc(100vw - 32px)); background: var(--paper); color: var(--ink); border: 1.5px solid var(--ink); padding: 16px 18px; display: grid; gap: 8px; box-shadow: 6px 6px 0 rgba(0, 0, 0, .12) }
.pop h4 { margin: 0; font: 400 22px/1.15 var(--display) }
.pop p { margin: 0; font: 400 16px/1.5 var(--book) }
.pop .src { font-size: 13px; color: var(--ink-2) }
.pop .x { position: absolute; right: 8px; top: 6px; border: 0; background: none; font-size: 22px; line-height: 1; cursor: pointer; color: var(--ink-2); padding: 4px 6px }
@media (max-width: 640px) { .pop { position: fixed; left: 0 !important; right: 0; top: auto !important; bottom: 0; width: 100%; border-width: 1.5px 0 0; padding: 18px max(18px, env(safe-area-inset-right, 0px)) max(22px, env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); box-shadow: 0 -8px 30px rgba(0, 0, 0, .2) } }

/* storyboard leaves */
.frame { border: 1.5px dashed var(--rule); padding: 18px 20px; display: grid; gap: 10px; background: var(--paper-2); aspect-ratio: auto }
.frame .scene { margin: 0; font: italic 400 15px/1.45 var(--book); color: var(--ink-2) }
.frame ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px }
.frame li b { font-weight: 600; color: var(--lapis); margin-right: 6px }

/* ------------------------------------------------ back matter */
.after { border-top: 1.5px solid var(--ink); margin-top: 20px; padding-top: 10px }
.after > section { padding-block: 30px; border-bottom: 1px solid var(--rule); display: grid; gap: 14px }
.after h2 { font-size: clamp(30px, 4.4vw, 42px) }
.scripture { font: 400 20px/1.7 var(--book); margin: 0 }
.scripture sup { font: 700 13px var(--book); color: var(--lapis); margin-right: 2px }
.verify { border-left: 3px solid var(--warn); padding: 8px 12px; font-size: 14px; color: var(--ink-2) }
dl.bg { margin: 0; display: grid; gap: 12px }
dl.bg div { display: grid; grid-template-columns: minmax(0, 11em) minmax(0, 1fr); gap: 4px 20px }
@media (max-width: 560px) { dl.bg div { grid-template-columns: minmax(0, 1fr) } }
dl.bg dt { font: 700 16px/1.4 var(--book) } dl.bg dd { margin: 0 }
.teachers { display: grid; gap: 18px }
.teacher blockquote { margin: 0; font: 400 19px/1.5 var(--book) }
.teacher .cite { font-size: 13px; color: var(--ink-2); margin-top: 4px }
.idea { border-left: 4px solid var(--lapis); padding: 4px 0 4px 20px; display: grid; gap: 10px }
[data-skin="kids"] .idea { border: 3px solid var(--ink); border-radius: 16px; background: var(--sun); padding: 22px; color: #17171B }
.idea h3 { font-size: clamp(28px, 4vw, 40px) }
.idea p { margin: 0; font-size: 18px }
.refs { display: grid; gap: 6px; font: 400 16px/1.5 var(--book) }
.refs b { font-family: var(--text); font-size: 14px; color: var(--lapis); margin-right: 6px }
[data-skin="kids"] .refs b { color: #1D2B99 }
.apply { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px }
.apply li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: start; padding: 12px 0; border-bottom: 1px dotted var(--rule) }
.apply input { width: 22px; height: 22px; margin-top: 3px; accent-color: var(--lapis) }
.apply label { display: grid; gap: 2px; cursor: pointer }
.apply label b { font: 400 21px/1.2 var(--display) }
.apply li.done label b { text-decoration: line-through; text-decoration-color: var(--lapis) }
.count { font-size: 14px; color: var(--ink-2) }
ol.qs { margin: 0; padding-left: 1.4em; display: grid; gap: 10px; font: 400 19px/1.45 var(--book) }
ol.qs li::marker { color: var(--lapis); font-weight: 700 }
.verse { font: italic 400 clamp(24px, 3.4vw, 32px)/1.4 var(--book); margin: 0 }
[data-skin="kids"] .verse { font: 600 clamp(22px, 3vw, 28px)/1.4 var(--text); font-style: normal }
.verse .w { cursor: pointer; border-radius: 3px }
.verse .w.gone { color: transparent; background: var(--lapis-soft); box-shadow: inset 0 -2px 0 var(--lapis) }
.prayer { font: italic 400 19px/1.5 var(--book); margin: 0 }
.next { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; padding-block: 30px 60px; text-decoration: none; color: inherit }
.next h3 { font-size: clamp(22px, 5vw, 30px); min-width: 0; overflow-wrap: anywhere }
.next { flex-wrap: wrap } .next:hover h3 { color: var(--lapis) }

/* guided reader */
.reader { position: fixed; inset: 0; z-index: 50; background: #08090B; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; color: #EAE8E2 }
.reader header, .reader footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)) }
.reader footer { padding-bottom: max(14px, env(safe-area-inset-bottom, 0px)) }
.reader .stage { display: grid; place-items: center; padding: 0 max(16px, env(safe-area-inset-left, 0px)); min-height: 0 }
.reader .panel { width: min(100%, calc((100vh - 170px) * 1.5)); cursor: pointer; border-color: #333 }
.rbtn { border: 1px solid #44464d; background: transparent; color: #EAE8E2; padding: 10px 16px; cursor: pointer; font: 500 14px var(--text) }

/* other views */
.view-head { padding-block: 40px 16px; display: grid; gap: 10px; max-width: 760px }
.view-head h1 { font-size: clamp(40px, 6vw, 64px) }
.view-head p { margin: 0; color: var(--ink-2) }
.lexicon { columns: 2 360px; column-gap: 48px; padding-block: 10px 50px }
.lexicon article { break-inside: avoid; padding-block: 14px; border-bottom: 1px solid var(--rule) }
.lexicon h3 { font-size: 24px; margin-bottom: 4px }
.lexicon p { margin: 4px 0; font: 400 16px/1.5 var(--book) }
.lexicon .kid { font-family: var(--text); font-size: 14px; color: var(--ink-2) }
.lexicon .src { font-size: 13px; color: var(--ink-2) }
.sheet-img { width: 100%; max-width: 100%; aspect-ratio: 9 / 5; object-fit: cover; display: block; border: 1px solid var(--ink) }
.cast { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 0 36px; padding-block: 20px 50px }
.cast article { padding-block: 14px; border-bottom: 1px solid var(--rule) }
.cast h3 { font-size: 24px } .cast p { margin: 4px 0; font-size: 15px }
.cast code, .prompt pre { font: 12.5px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--ink-2) }
.prompt { border-top: 1px solid var(--rule); padding-block: 18px; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px }
@media (max-width: 700px) { .prompt { grid-template-columns: minmax(0, 1fr) } }
.prompt img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border: 1px solid var(--ink) }
.prompt pre { margin: 0; white-space: pre-wrap; max-height: 240px; overflow: auto }
select { font: inherit; background: var(--paper); color: var(--ink); border: 1.5px solid var(--ink); padding: 8px 10px }
.about { display: grid; gap: 22px; padding-block: 10px 60px; max-width: 760px }
.about h2 { font-size: 30px; margin-top: 10px }
.about p, .about li { font-size: 17px }
.about table { border-collapse: collapse; width: 100%; font-size: 15px }
.about td, .about th { border-bottom: 1px solid var(--rule); padding: 8px 10px 8px 0; text-align: left; vertical-align: top }
.tablewrap { overflow-x: auto }
footer.site { padding-block: 30px 60px; color: var(--ink-2); font-size: 13px; border-top: 1px solid var(--rule) }

/* before-you-read, map, cast, quiz, listen */
.before { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 28px; padding: 22px 0 26px; border-bottom: 1px solid var(--rule); margin-bottom: 28px }
@media (max-width: 720px) { .before { grid-template-columns: minmax(0, 1fr) } .before .map { max-width: 220px } }
.before h2 { font-size: 28px; margin-bottom: 4px }
.before dl { margin: 0; display: grid; gap: 10px }
.before dt { font: italic 400 15px var(--book); color: var(--ink-2) }
.before dd { margin: 0; font-size: 17px }
.before .ask { font: italic 400 20px/1.4 var(--book); color: var(--lapis); border-left: 3px solid var(--lapis); padding-left: 12px }
.cast-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px }

.who-chip i { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 700 13px var(--text); color: #fff; font-style: normal; border: 2px solid var(--ink) }

.quiz h2 { font-size: clamp(30px, 4.4vw, 42px) }
.qa { display: grid; gap: 10px }
.qa > b { font: 400 22px/1.3 var(--display) }
.qopts { display: flex; flex-wrap: wrap; gap: 8px }
.qopt { border: 1.5px solid var(--ink); background: transparent; padding: 10px 16px; cursor: pointer; font-size: 16px; border-radius: 2px }
[data-skin="kids"] .qopt { border-radius: 12px; font-size: 18px }
.qopt[data-state="right"] { background: #1F7A4D; border-color: #1F7A4D; color: #fff }
.qopt[data-state="wrong"] { background: transparent; border-color: var(--warn); color: var(--warn); text-decoration: line-through }
.qwhy { font: italic 400 17px/1.45 var(--book); color: var(--ink-2); margin: 0 }
.score { font-size: 15px; color: var(--ink-2) }
.listen { display: inline-flex; align-items: center; gap: 8px }
.panel.speaking { outline: 4px solid var(--lapis); outline-offset: 4px }
.continue { display: flex; gap: 10px; align-items: baseline; margin-top: 16px; font-size: 15px; color: var(--ink-2) }
.toc .done-mark { color: #1F7A4D; font-family: var(--text); font-size: 12px; display: block }

/* ===================================================== design switcher + cast cards (all designs) */
.design-sw { display: flex; align-items: center; gap: 4px; width: 100%; justify-content: flex-end; font-size: 13px }
.design-sw .sw-label { color: var(--ink-2); margin-right: 6px }
.design-sw button { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--rule); background: transparent; color: var(--ink); padding: 5px 10px; cursor: pointer; font: 500 13px var(--text) }
.design-sw button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper) }
.sw { width: 14px; height: 14px; display: inline-block; border-radius: 50% }
.sw-book { background: linear-gradient(135deg, #F1F1EC 50%, #2A3CC0 50%) }
.sw-icon { background: linear-gradient(135deg, #1B140F 50%, #D9B456 50%) }
.sw-comic { background: conic-gradient(#FFE600 0 33%, #00A3E0 0 66%, #E5007D 0) }
.cast-row { gap: 10px }
.who-chip { display: inline-flex; align-items: center; gap: 10px; border: 1.5px solid var(--rule); background: var(--paper); padding: 5px 14px 5px 5px; border-radius: 999px; cursor: pointer; text-align: left }
.who-chip img { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; display: block; border: 2px solid var(--ink) }
.who-chip span { display: grid; line-height: 1.2 }
.who-chip b { font-weight: 600; font-size: 15px }
.who-chip small { font-size: 12px; color: var(--ink-2); max-width: 22ch; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.who-pop .who-big { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 2px solid var(--ink) }

[data-design="icon"] .panel, [data-design="icon"] .plate img, [data-design="icon"] .toc .thumb { border: 2px solid var(--gold); box-shadow: 0 0 0 5px #120D09, 0 0 0 6px #7A5E28; border-radius: 0 }

[data-design="icon"] .gloss { border-left: 0; padding-left: 0; position: relative }

[data-design="icon"] .gloss .say { color: var(--ink) }

[data-design="comic"] .eyebrow { font: 700 13px var(--text); color: #fff; background: var(--magenta); display: inline-block; padding: 3px 8px; justify-self: start; text-transform: uppercase; letter-spacing: .04em; font-style: normal }

[data-design="comic"] .qopt { border: 3px solid #111; box-shadow: 3px 3px 0 #111; border-radius: 0; font: 700 16px var(--text); background: #fff }

[data-design="comic"] .qopt[data-state="wrong"] { background: var(--magenta); border-color: #111; color: #fff }

};

const t = (k, ...a) => { const v = UI[S.lang][k]; return typeof v === "function" ? v(...a) : v };
const L = o => (o && typeof o === "object" && !Array.isArray(o) ? (o[S.lang] ?? o.en) : o);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const CH = Object.fromEntries(DATA.characters.characters.map(c => [c.id, c]));

const urls = new Map();
function art(src) {
  if (!src) return "";
  if (src.png) return S.track === "orthodox" && src.pngOrth ? src.pngOrth : src.png;
  const key = src.id + "|" + S.track;
  if (!urls.has(key)) {
    const text = S.track === "orthodox" ? src.svg : src.svg.replace(/<g class="nimbus">[\s\S]*?<\/g>/g, "");
    urls.set(key, URL.createObjectURL(new Blob([text], { type: "image/svg+xml" })));
  }
  return urls.get(key);
}

// mark glossary words in a piece of text: returns safe HTML
function marked(text, used) {
  let html = esc(text);
  const hits = [];
  for (const term of TERMS) {
    if (used && used.has(term.id)) continue;
    for (const m of term.match[S.lang] || []) {
      const i = html.toLowerCase().indexOf(esc(m).toLowerCase());
      if (i < 0) continue;
      if (hits.some(h => i < h.end && i + m.length > h.start)) continue;
      // extend to the end of the word
      let end = i + esc(m).length;
      while (end < html.length && /[\p{L}]/u.test(html[end])) end++;
      hits.push({ start: i, end, id: term.id });
      used && used.add(term.id);
      break;
    }
  }
  hits.sort((a, b) => b.start - a.start);
  for (const h of hits) html = html.slice(0, h.start) + `<button class="term" type="button" data-t="${h.id}">${html.slice(h.start, h.end)}<sup aria-hidden="true">?</sup></button>` + html.slice(h.end);
  return html;
}

    const set = new Set(JSON.parse(store.get(key, "[]")));
    cb.checked ? set.add(+cb.dataset.i) : set.delete(+cb.dataset.i);
    store.set(key, JSON.stringify([...set]));
    cb.closest("li").classList.toggle("done", cb.checked);
    document.getElementById("count").textContent = t("stepsDone", set.size, app.querySelectorAll(".apply input").length);
  });
  const ws = [...app.querySelectorAll("#verse .w")];
  const order = ws.map((_, i) => i).sort((a, b) => ((a * 7919) % 13) - ((b * 7919) % 13));
  let k = 0;
  document.getElementById("hideW").onclick = () => { if (k < order.length) ws[order[k++]].classList.add("gone") };
  document.getElementById("showW").onclick = () => { ws.forEach(w => w.classList.remove("gone")); k = 0 };
  ws.forEach(w => w.onclick = () => w.classList.toggle("gone"));
  app.querySelectorAll("[data-more]").forEach(b => b.onclick = () => {
    const box = b.nextElementSibling, open = box.hidden;
    box.hidden = !open; b.setAttribute("aria-expanded", String(open)); b.textContent = open ? t("hideChild") : t("howToChild");
  });
  app.querySelectorAll(".strip .panel").forEach(p => p.addEventListener("click", ev => { if (!ev.target.closest(".term")) guided(n, +p.dataset.i) }));
  const z = document.getElementById("zoom"); if (z) z.onclick = () => guided(n, 0);
  store.set("mk3.last", String(n)); store.set(`mk3.read.${n}`, "1");
  // quiz
  const x = DATA.extras.episodes[n]; let right = 0, answered = 0;
  app.querySelectorAll(".qa").forEach(qa => qa.querySelectorAll(".qopt").forEach(btn => btn.onclick = () => {
    if (qa.dataset.done) return;
    const q = x.quiz[+qa.dataset.q], j = +btn.dataset.j;
    qa.dataset.done = "1"; answered++;
    if (j === q.answer) { right++; btn.dataset.state = "right" } else { btn.dataset.state = "wrong"; qa.querySelectorAll(".qopt")[q.answer].dataset.state = "right" }
    qa.querySelector(".qwhy").hidden = false;
    document.getElementById("score").textContent = t("score", right, answered);
  }));
  // cast chips
  app.querySelectorAll(".who-chip").forEach(b => b.onclick = ev => { ev.stopPropagation(); openWho(b) });
  // listen
  const lb = document.getElementById("listen");
  if (lb) lb.onclick = () => speakEpisode(n, lb);
}
let speaking = false;
function speakEpisode(n, btn) {
  const synth = window.speechSynthesis;
  if (speaking) { synth.cancel(); speaking = false; btn.textContent = "▶ " + t("listen"); document.querySelectorAll(".panel.speaking").forEach(p => p.classList.remove("speaking")); return }
  const e = EP[n], panels = [...document.querySelectorAll(".strip .panel")];
  speaking = true; btn.textContent = "■ " + t("stop");
  e.episode.panels.forEach((p, i) => {
    const text = (p.bubbles[S.age] || []).map(b => L(b.text)).join(" ");
    const u = new SpeechSynthesisUtterance(text);
    u.lang = S.lang === "ru" ? "ru-RU" : "en-US"; u.rate = S.age === "kids" ? .9 : 1;
    u.onstart = () => { panels.forEach(x => x.classList.remove("speaking")); if (panels[i]) { panels[i].classList.add("speaking"); panels[i].scrollIntoView({ behavior: "smooth", block: "center" }) } };
    if (i === e.episode.panels.length - 1) u.onend = () => { speaking = false; btn.textContent = "▶ " + t("listen"); panels.forEach(x => x.classList.remove("speaking")) };
    synth.speak(u);
  });
}
function openWho(btn) {
  const c = CH[btn.dataset.who]; if (!c) return;
  const host = document.getElementById("popHost");
  host.innerHTML = `<div class="pop who-pop" role="dialog" aria-label="${esc(L(c.name))}"><button class="x" type="button" aria-label="${esc(t("close"))}">×</button><img class="who-big" src="${art(DATA.portraits[S.age][c.id])}" alt=""><h4>${esc(L(c.name))}</h4><p>${esc(L(c.role))}</p><div class="src"><a href="#cast">${esc(t("cast"))}</a></div></div>`;
  const pop = host.firstElementChild, r = btn.getBoundingClientRect();
  pop.style.left = Math.max(16, Math.min(r.left + scrollX, scrollX + document.documentElement.clientWidth - pop.offsetWidth - 16)) + "px";
  pop.style.top = (r.bottom + scrollY + 8) + "px";
  pop.querySelector(".x").onclick = closeTerm;
}

function guided(n, start) {
  const e = EP[n], ps = e.episode.panels; let i = start, step = 0;
  const ov = document.getElementById("overlay");
  const close = () => { ov.innerHTML = ""; ov.onkeydown = null };
  const draw = () => {
    const nb = (ps[i].bubbles[S.age] || []).length;
    ov.innerHTML = `<div class="reader" role="dialog" aria-modal="true"><header><span>${esc(L(e.episode.title))} · ${esc(t("frame"))} ${i + 1} / ${ps.length}</span><button class="rbtn" type="button" id="rX">${esc(t("close"))}</button></header>
      <div class="stage">${panelHTML(e, ps[i], i, true)}</div><footer><button class="rbtn" type="button" id="rP">← ${esc(t("prev"))}</button><button class="rbtn" type="button" id="rN">${esc(t("next"))} →</button></footer></div>`;
    ov.querySelectorAll(".b").forEach((b, j) => b.classList.toggle("hidden", j >= step));
    requestAnimationFrame(() => tails(ov));
    const nx = () => { if (step < nb) { step++; draw() } else if (i < ps.length - 1) { i++; step = 0; draw() } else close() };
    const pv = () => { if (step > 0) { step--; draw() } else if (i > 0) { i--; step = (ps[i].bubbles[S.age] || []).length; draw() } };
    ov.querySelector("#rN").onclick = nx; ov.querySelector("#rP").onclick = pv; ov.querySelector("#rX").onclick = close;
    ov.querySelector(".stage .panel").onclick = nx;
    ov.onkeydown = ev => { if (ev.key === "ArrowRight" || ev.key === " ") { ev.preventDefault(); nx() } if (ev.key === "ArrowLeft") pv(); if (ev.key === "Escape") close() };
    ov.querySelector("#rN").focus();
  };
  draw();
}

function tails(root = document) {
  root.querySelectorAll(".panel").forEach(panel => {
    const svg = panel.querySelector(".tails"), pr = panel.getBoundingClientRect();
    if (!pr.width) return;
    svg.setAttribute("viewBox", `0 0 ${pr.width} ${pr.height}`);
    let out = "";
    panel.querySelectorAll(".b[data-tx]").forEach(b => {
      if (b.classList.contains("hidden")) return;
      const r = b.getBoundingClientRect();
      const tx = pr.width * b.dataset.tx / 100, ty = pr.height * b.dataset.ty / 100;
      const bx = Math.min(Math.max(tx, r.left - pr.left + r.width * .25), r.right - pr.left - r.width * .25);
      const by = ty > r.bottom - pr.top ? r.bottom - pr.top - 3 : r.top - pr.top + 3;
      const w = Math.max(6, Math.min(14, r.width * .06));
      out += `<path d="M${bx - w} ${by} Q${(bx + tx) / 2} ${(by + ty) / 2} ${tx} ${ty} Q${(bx + tx) / 2 + 2} ${(by + ty) / 2} ${bx + w} ${by} Z" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round" ${b.classList.contains("whisper") ? 'stroke-dasharray="5 4"' : ""}/>`;
    });
    svg.innerHTML = out;
  });
}

// ------------------------------------------------------------ glossary popover
function openTerm(btn) {
  const term = TERM[btn.dataset.t];
  if (!term) return;
  const host = document.getElementById("popHost");
  host.innerHTML = `<div class="pop" role="dialog" aria-label="${esc(L(term.name))}"><button class="x" type="button" aria-label="${esc(t("close"))}">×</button>
    <h4>${esc(L(term.name))}</h4><p>${esc(L(term[S.age]))}</p>
    ${S.age === "adults" ? `<p class="small" style="font-family:var(--text)">${esc(t("forChild"))}: ${esc(L(term.kids))}</p>` : ""}
    <div class="src">${esc(t("source"))}: ${esc(term.source)} · <a href="#lexicon">${esc(t("allWords"))}</a></div></div>`;
  const pop = host.firstElementChild;
  const r = btn.getBoundingClientRect();
  const w = pop.offsetWidth;
  pop.style.left = Math.max(16, Math.min(r.left + scrollX, scrollX + document.documentElement.clientWidth - w - 16)) + "px";
  pop.style.top = (r.bottom + scrollY + 8) + "px";
  pop.querySelector(".x").onclick = closeTerm;
  pop.querySelector(".x").focus({ preventScroll: true });
}
function closeTerm() { document.getElementById("popHost").innerHTML = "" }
document.addEventListener("click", ev => {
  const b = ev.target.closest(".term");
  if (b) { ev.preventDefault(); ev.stopPropagation(); openTerm(b); return }
  if (!ev.target.closest(".pop")) closeTerm();
}, true);
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeTerm() });

// ------------------------------------------------------------ other views
function renderLexicon() {
  const list = [...TERMS].sort((a, b) => L(a.name).localeCompare(L(b.name), S.lang));
  return `<div class="page"><header class="view-head"><h1>${esc(t("lexTitle"))}</h1><p>${esc(t("lexText"))}</p></header>
    <div class="lexicon">${list.map(x => `<article id="t-${x.id}"><h3>${esc(L(x.name))}</h3><p>${esc(L(x.adults))}</p><p class="kid">${esc(t("forChild"))}: ${esc(L(x.kids))}</p><div class="src">${esc(t("source"))}: ${esc(x.source)}</div></article>`).join("")}</div></div>`;
}
function renderCast() {
  return `<div class="page"><header class="view-head"><h1>${esc(t("castTitle"))}</h1><p>${esc(t("castText"))}</p></header>
    <img class="sheet-img" src="${art(DATA.sheets[S.age])}" alt="">
    <div class="cast">${DATA.characters.characters.filter(c => !c.extra).map(c => `<article><h3>${esc(L(c.name))}</h3><p>${esc(L(c.role))}</p><code>${esc(c.look)}</code></article>`).join("")}</div></div>`;
}
let studioEp = 12;
function renderStudio() {
  const e = EP[studioEp], P = e.prompts[S.age], suf = S.track === "orthodox" ? ".orthodox" : "";
  return `<div class="page"><header class="view-head"><h1>${esc(t("studioTitle"))}</h1><p>${esc(t("studioText"))}</p>
    <div class="row"><label for="stSel" class="small">${esc(t("episode"))}</label><select id="stSel">${Object.values(DATA.episodes).sort((a, b) => a.episode.number - b.episode.number).map(x => `<option value="${x.episode.number}" ${x.episode.number === studioEp ? "selected" : ""}>${x.episode.number}. ${esc(L(x.episode.title))}</option>`).join("")}</select></div></header>
    ${e.episode.panels.map(p => { const k = P[p.id + suf] ? p.id + suf : p.id, img = e.art[S.age][p.id];
      return `<div class="prompt"><div><img src="${art(img || e.cover[S.age])}" alt=""><div class="row" style="margin-top:8px"><span class="small">${esc(k)}</span><button class="linkish" type="button" data-k="${k}">${esc(t("copy"))}</button></div></div><pre>${esc(P[k] || "")}</pre></div>` }).join("")}</div>`;
}
function bindStudio() {
  const sel = document.getElementById("stSel"); sel.onchange = () => { studioEp = +sel.value; render() };
  document.querySelectorAll("[data-k]").forEach(b => b.onclick = () => {
    const text = EP[studioEp].prompts[S.age][b.dataset.k];
    const pre = b.closest(".prompt").querySelector("pre");
    const fb = () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r) };
    try { navigator.clipboard.writeText(text).then(() => b.textContent = t("copied"), fb) } catch (e) { fb() }
  });
}
function renderAbout() { return `<div class="page"><header class="view-head"><h1>${esc(t("about"))}</h1></header><div class="about">${L(DATA.about)}</div></div>` }

// ------------------------------------------------------------ render
function render(keep) {
  renderBar(); closeTerm();
  const r = route(), app = document.getElementById("app"), y = scrollY;
  app.innerHTML = (r.v === "ep" ? renderEp(r.n) : r.v === "lexicon" ? renderLexicon() : r.v === "cast" ? renderCast() : r.v === "studio" ? renderStudio() : r.v === "about" ? renderAbout() : renderHome())
    + `<footer class="site"><div class="page">${esc(t("footer"))}</div></footer>`;
  if (r.v === "ep") bindEp(r.n);
  if (r.v === "studio") bindStudio();
  requestAnimationFrame(() => tails(app));
  document.fonts && document.fonts.ready.then(() => tails(app));
  if (keep) scrollTo(0, y);
}
addEventListener("hashchange", () => { try { speechSynthesis.cancel(); speaking = false } catch (e) {} document.getElementById("overlay").innerHTML = ""; render(); scrollTo(0, 0) });
new ResizeObserver(() => tails(document)).observe(document.body);
render();
if (!S.setup) setup(true);
</script>
